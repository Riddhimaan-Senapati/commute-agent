services:
  - type: web
    name: commute-agent
    runtime: docker
    plan: 2c-4g # measured peak 3.2 GB; 1c-2g runs out of memory loading the street graphs
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: "off" # GitHub Actions deploys after tests pass
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # Trips the cache lacks get transit from the OTP private service below.
      - key: COMMUTE_OTP_HOSTPORT
        fromService:
          name: commute-otp
          type: pserv
          property: hostport
  - type: pserv
    name: commute-otp
    runtime: docker
    plan: standard # 2 GB; OTP holds the Boston graph in about 1.6 GB of heap
    region: virginia
    rootDir: docker/otp-render
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
