# Multipliers on free-flow drive time by day type and hour (America/New_York local time).
# A bucket starts at its first hour and ends before its second, so 17-18 is 17:00 to 17:59.
#
# Source: TomTom Traffic Index, Boston, MA traffic report, 2025 data, City area, the
# "Driving patterns" grid set to Congestion level with "Show values" on, read 2026-10-25.
# TomTom defines a congestion level of 40 as journey times 40% longer than free flow
# (https://www.tomtom.com/traffic-index/about/), so value = 1 + level / 100.
# weekday = mean of Monday to Friday for that hour; weekend = mean of Saturday and Sunday.
# Rounded to two decimals. The grid is a citywide average, not a per-road speed.

weekday:
  "0-1":
    value: 1.1
