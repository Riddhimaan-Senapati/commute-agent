name: test
# Runs the checks on every push to main. Deploying is off: the Render services are
# suspended, and the Hugging Face Space deploy lives on the hf-spaces branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv sync --frozen
      - run: uv run ruff check commute_agent tests eval
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: npm run typecheck
        working-directory: webapp
